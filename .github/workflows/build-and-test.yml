name: Build Test and Pack

on:
  push:
    branches: [main]
    paths-ignore: ["assets/**", "docs/**", "examples/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["assets/**", "docs/**", "examples/**"]

jobs:
  build:
    name: Build Test and Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore ./src/template

      - name: Build
        run: dotnet build ./src/template -c Debug --no-restore

      - name: Test
        run: dotnet test ./src/template -c Debug --no-build --verbosity normal --report-trx --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GenocsTestResults
          path: TestResults/*.trx

      - name: Pack
        run: dotnet pack ./src/template -c Debug --no-build --verbosity normal
